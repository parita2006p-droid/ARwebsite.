<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Active Math - Grade 3</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Fredoka', 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      user-select: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #video { transform: scaleX(-1); }
    #canvas { transform: scaleX(-1); }
    
    /* HUD Overlays */
    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 600px;
    }
    #equation-card {
      background: #facc15;
      color: #1e1b4b;
      font-size: 3.5rem;
      font-weight: 900;
      padding: 15px 40px;
      border-radius: 25px;
      border: 6px solid #4c1d95;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
      letter-spacing: 2px;
      min-width: 280px;
    }
    #stats-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-top: 15px;
      font-size: 1.5rem;
      font-weight: 800;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    .stat-pill {
      background: rgba(15, 23, 42, 0.7);
      padding: 8px 20px;
      border-radius: 50px;
      border: 2px solid rgba(255,255,255,0.2);
    }
    #feedback-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 5rem;
      font-weight: 900;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 20;
    }
  </style>
</head>
<body>

<div id="game-container">
  <video id="video" playsinline></video>
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div id="equation-card">Loading...</div>
    <div id="stats-bar">
      <div class="stat-pill">⏱️ Time: <span id="timer">60</span>s</div>
      <div class="stat-pill">⭐ Score: <span id="score">0</span></div>
      <div class="stat-pill">🔥 Combo: <span id="combo">x1</span></div>
    </div>
  </div>

  <div id="feedback-overlay"></div>
</div>

<script>
  // --- 1. GRADE 3 MATH GENERATOR ---
  class MathEngine {
    static generateQuestion() {
      const types = ['add', 'sub', 'mult', 'div'];
      const chosenType = types[Math.floor(Math.random() * types.length)];
      
      let num1, num2, answer, equationStr;

      switch (chosenType) {
        case 'add':
          num1 = Math.floor(Math.random() * 450) + 50;
          num2 = Math.floor(Math.random() * 450) + 50;
          answer = num1 + num2;
          equationStr = `${num1} + ${num2} = ?`;
          break;
        case 'sub':
          num1 = Math.floor(Math.random() * 800) + 100;
          num2 = Math.floor(Math.random() * (num1 - 50)) + 50;
          answer = num1 - num2;
          equationStr = `${num1} - ${num2} = ?`;
          break;
        case 'mult':
          num1 = Math.floor(Math.random() * 9) + 2; // 2 through 10
          num2 = Math.floor(Math.random() * 9) + 2;
          answer = num1 * num2;
          equationStr = `${num1} × ${num2} = ?`;
          break;
        case 'div':
          num2 = Math.floor(Math.random() * 8) + 2; // divisor 2..9
          answer = Math.floor(Math.random() * 9) + 2; // quotient 2..9
          num1 = num2 * answer;
          equationStr = `${num1} ÷ ${num2} = ?`;
          break;
      }

      // Generate 3 plausible distractors
      const distractors = new Set();
      while (distractors.size < 3) {
        let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() < 0.5 ? 1 : -1);
        if (chosenType === 'mult') offset *= 2;
        let fake = answer + offset;
        if (fake > 0 && fake !== answer) distractors.add(fake);
      }

      const choices = Array.from(distractors);
      const correctIndex = Math.floor(Math.random() * 4);
      choices.splice(correctIndex, 0, answer);

      return { equation: equationStr, answer: answer, choices: choices };
    }
  }

  // --- 2. GAME STATE & SPATIAL TARGETS ---
  const videoElement = document.getElementById('video');
  const canvasElement = document.getElementById('canvas');
  const canvasCtx = canvasElement.getContext('2d');
  
  let currentQuestion = null;
  let targets = [];
  let score = 0;
  let combo = 1;
  let timeLeft = 60;
  let gameActive = true;
  let smoothedHands = { left: { x: 0.5, y: 0.5 }, right: { x: 0.5, y: 0.5 } };

  // Fixed normalized 2D grid locations for target bubbles
  const SPATIAL_SLOTS = [
    { x: 0.20, y: 0.35, color: '#06B6D4' }, // Top Left
    { x: 0.80, y: 0.35, color: '#E11D48' }, // Top Right
    { x: 0.25, y: 0.70, color: '#84CC16' }, // Bottom Left
    { x: 0.75, y: 0.70, color: '#F59E0B' }  // Bottom Right
  ];

  function spawnQuestion() {
    currentQuestion = MathEngine.generateQuestion();
    document.getElementById('equation-card').innerText = currentQuestion.equation;

    targets = currentQuestion.choices.map((val, idx) => ({
      value: val,
      isCorrect: val === currentQuestion.answer,
      x: SPATIAL_SLOTS[idx].x,
      y: SPATIAL_SLOTS[idx].y,
      color: SPATIAL_SLOTS[idx].color,
      radius: 0.09 // Normalized radius
    }));
  }

  // --- 3. POSE TRACKING & COLLISION DETECTION ---
  function onResults(results) {
    // Resize canvas dynamically
    canvasElement.width = window.innerWidth;
    canvasElement.height = window.innerHeight;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

    // Draw Target Bubbles
    drawTargets();

    if (results.poseLandmarks) {
      const landmarks = results.poseLandmarks;
      
      // Extract Hand Coordinates (Mirrored X for intuitive user experience)
      const rawLeftWrist = landmarks[15];
      const rawRightWrist = landmarks[16];

      if (rawLeftWrist && rawRightWrist) {
        // Apply EMA Filter
        const alpha = 0.35;
        smoothedHands.left.x = alpha * rawLeftWrist.x + (1 - alpha) * smoothedHands.left.x;
        smoothedHands.left.y = alpha * rawLeftWrist.y + (1 - alpha) * smoothedHands.left.y;
        
        smoothedHands.right.x = alpha * rawRightWrist.x + (1 - alpha) * smoothedHands.right.x;
        smoothedHands.right.y = alpha * rawRightWrist.y + (1 - alpha) * smoothedHands.right.y;

        // Render Hand Tracker Colliders
        drawHandTracker(smoothedHands.left);
        drawHandTracker(smoothedHands.right);

        // Process Collision Checks
        if (gameActive) {
          checkCollisions(smoothedHands.left);
          checkCollisions(smoothedHands.right);
        }
      }
    }
    canvasCtx.restore();
  }

  function drawTargets() {
    const w = canvasElement.width;
    const h = canvasElement.height;

    targets.forEach(target => {
      const px = target.x * w;
      const py = target.y * h;
      const pr = target.radius * Math.min(w, h);

      // Bubble Outer Glow
      canvasCtx.beginPath();
      canvasCtx.arc(px, py, pr + 6, 0, 2 * Math.PI);
      canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      canvasCtx.fill();

      // Bubble Body
      canvasCtx.beginPath();
      canvasCtx.arc(px, py, pr, 0, 2 * Math.PI);
      canvasCtx.fillStyle = target.color;
      canvasCtx.fill();
      canvasCtx.lineWidth = 4;
      canvasCtx.strokeStyle = '#FFFFFF';
      canvasCtx.stroke();

      // Bubble Text Value
      canvasCtx.fillStyle = '#FFFFFF';
      canvasCtx.font = `900 ${pr * 0.7}px Fredoka, sans-serif`;
      canvasCtx.textAlign = 'center';
      canvasCtx.textBaseline = 'middle';
      // Un-mirror text rendering on canvas
      canvasCtx.save();
      canvasCtx.translate(px, py);
      canvasCtx.scale(-1, 1);
      canvasCtx.fillText(target.value, 0, 0);
      canvasCtx.restore();
    });
  }

  function drawHandTracker(hand) {
    const px = hand.x * canvasElement.width;
    const py = hand.y * canvasElement.height;

    canvasCtx.beginPath();
    canvasCtx.arc(px, py, 24, 0, 2 * Math.PI);
    canvasCtx.fillStyle = 'rgba(250, 204, 21, 0.8)';
    canvasCtx.fill();
    canvasCtx.lineWidth = 4;
    canvasCtx.strokeStyle = '#FFFFFF';
    canvasCtx.stroke();
  }

  function checkCollisions(hand) {
    const aspect = canvasElement.width / canvasElement.height;
    
    targets.forEach(target => {
      // Adjusted Euclidean distance in normalized coordinate space
      const dx = (hand.x - target.x) * aspect;
      const dy = hand.y - target.y;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < target.radius + 0.04) {
        handleAnswer(target);
      }
    });
  }

  function handleAnswer(target) {
    const feedbackEl = document.getElementById('feedback-overlay');
    
    if (target.isCorrect) {
      score += 100 * combo;
      combo++;
      showFeedback('🎉 CORRECT! +100', '#22C55E');
    } else {
      combo = 1;
      timeLeft = Math.max(0, timeLeft - 3); // 3-second penalty
      showFeedback('❌ WRONG! -3s', '#EF4444');
    }

    document.getElementById('score').innerText = score;
    document.getElementById('combo').innerText = `x${combo}`;
    
    // Spawn next equation
    spawnQuestion();
  }

  function showFeedback(text, color) {
    const el = document.getElementById('feedback-overlay');
    el.innerText = text;
    el.style.color = color;
    el.style.opacity = '1';
    el.style.transform = 'translate(-50%, -50%) scale(1.2)';
    
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translate(-50%, -50%) scale(1.0)';
    }, 600);
  }

  // --- 4. GAME INITIALIZATION & MEDIAPIPE PIPELINE ---
  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6
  });

  pose.onResults(onResults);

  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await pose.send({ image: videoElement });
    },
    width: 1280,
    height: 720
  });

  // Start Session
  camera.start();
  spawnQuestion();

  // Timer Loop
  const timerInterval = setInterval(() => {
    if (timeLeft > 0) {
      timeLeft--;
      document.getElementById('timer').innerText = timeLeft;
    } else {
      gameActive = false;
      clearInterval(timerInterval);
      document.getElementById('equation-card').innerText = "GAME OVER!";
      showFeedback(`Final Score: ${score}`, '#FACC15');
    }
  }, 1000);
</script>
</body>
</html>
